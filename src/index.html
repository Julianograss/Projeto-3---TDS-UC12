<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto 3 - To-Do List</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <b>Projeto 3 - Aplicação Interativa (To-Do List)</b>
      </header>
      <section class="campo-form">
        <form action="#" method="POST" class="cadastro-tarefas">
          <fieldset class="formulario">
            <legend>Cadastre uma nova tarefa</legend>

            <div class="formulario-grid">
              <div class="form-inputs">
                <div class="input-group nome-group">
                  <label for="nome">Nome da tarefa</label>
                  <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                    placeholder="Digite o nome da tarefa"
                  />
                </div>

                <div class="input-group data-group">
                  <label for="data">Data limite</label>
                  <input type="date" id="data" name="data" required />
                </div>

                <div class="input-group prioridade-group">
                  <label>Prioridade da tarefa</label>

                  <div class="prioridades">
                    <div class="baixa">
                      <input
                        type="radio"
                        id="baixa"
                        name="prioridade"
                        value="baixa"
                      />
                      <label for="baixa">Baixa</label>
                    </div>

                    <div class="media">
                      <input
                        type="radio"
                        id="media"
                        name="prioridade"
                        value="media"
                      />
                      <label for="media">Média</label>
                    </div>

                    <div class="alta">
                      <input
                        type="radio"
                        id="alta"
                        name="prioridade"
                        value="alta"
                      />
                      <label for="alta">Alta</label>
                    </div>
                  </div>
                </div>

                <div class="input-group hora-group">
                  <label for="hora">Horário limite</label>
                  <input type="time" id="hora" name="hora" required />
                </div>
              </div>

              <aside class="descricao-form">
                <div class="input-group descricao-group">
                  <label for="descricao">Descrição da tarefa</label>

                  <textarea
                    id="descricao"
                    name="descricao"
                    placeholder="Digite a descrição da tarefa"
                  ></textarea>
                </div>
              </aside>

              <button id="btn-cadastrar" type="submit" class="btn-submit">
                Cadastrar tarefa
              </button>
            </div>
          </fieldset>
        </form>
      </section>
      <section class="campo-lista">
        <form>
          <fieldset>
            <legend>Lista de tarefas</legend>
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Prioridade</th>
                  <th>Descrição</th>
                  <th>Status</th>
                  <th>Data/Hora</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="lista-tarefas"></tbody>
            </table>
          </fieldset>
        </form>
      </section>
    </main>
  </body>
</html>
